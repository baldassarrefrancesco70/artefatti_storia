<title>Mappa del Novecento — Convitto Vico</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:#faf9f6;color:#1a1a18}
#hd{padding:.6rem 1.25rem .4rem;border-bottom:1px solid #d4d0c8;display:flex;align-items:baseline;gap:.75rem;flex-wrap:wrap}
#hd h1{font-size:.9rem;font-weight:700}
#hd p{font-size:.72rem;color:#888780}
#cb{display:flex;flex-wrap:wrap;align-items:center;gap:5px 10px;padding:.4rem 1.25rem;border-bottom:1px solid #d4d0c8;background:#f0ede6}
.cl{font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:.67rem;color:#888780}
.fb,.ab{display:inline-flex;align-items:center;gap:5px;border:1px solid #d4d0c8;background:#faf9f6;padding:2px 8px;border-radius:4px;cursor:pointer;font-size:.77rem;font-family:inherit;transition:all .15s}
.fb:hover{border-color:var(--fc)} .ab:hover{border-color:var(--ac)}
.fb.on{background:rgba(0,0,0,.05);border-color:var(--fc);font-weight:600}
.ab.on{background:rgba(0,0,0,.05);border-color:var(--ac);font-weight:600}
.fd{width:8px;height:8px;border-radius:50%;background:var(--fc);flex-shrink:0}
.ad{width:8px;height:8px;border-radius:2px;background:var(--ac);flex-shrink:0}
.sep{width:1px;height:16px;background:#d4d0c8}
.hint{font-size:.7rem;color:#888780;font-style:italic}
#mw{overflow-x:auto}
svg#map{display:block;max-width:900px;margin:0 auto}
.nodo{cursor:pointer}
.nodo:hover .nrect{filter:brightness(.93)}
#ip{position:fixed;bottom:1rem;right:1rem;background:white;border:1px solid #d4d0c8;border-radius:8px;padding:.7rem 1rem .8rem;font-size:.8rem;max-width:240px;max-height:280px;overflow-y:auto;box-shadow:0 2px 12px rgba(0,0,0,.12);z-index:100;line-height:1.6}
#ipc{position:absolute;top:5px;right:8px;background:none;border:none;cursor:pointer;font-size:1rem;color:#888;padding:0}
#ipn{font-weight:700;margin-right:1.2rem;margin-bottom:.4rem;font-size:.85rem;line-height:1.3}
#ipd{color:#3d3d3a;font-size:.77rem;line-height:1.6}
</style>
</head>

</div>

<script>
const FL={"dem": {"label": "democrazia", "col": "#378ADD"}, "vio": {"label": "stato-violenza", "col": "#E24B4A"}, "ord": {"label": "ordine internazionale", "col": "#7F77DD"}, "mer": {"label": "stato-mercato", "col": "#EF9F27"}, "ita": {"label": "vicenda italiana", "col": "#1D9E75"}};
const DS={"pop": "Movimenti politici che mettono in discussione le istituzioni liberali e la democrazia rappresentativa. I sovranismi europei e americani concentrano il potere nell'esecutivo e limitano i contrappesi. La domanda è se stiamo assistendo a un'erosione strutturale o a un normale ciclo politico.", "weim": "La Repubblica di Weimar nasce dalla sconfitta nella Prima guerra mondiale e muore per via legale nel 1933: Hitler viene nominato cancelliere e ottiene i pieni poteri dal Parlamento. Il caso più studiato di morte legale della democrazia, con un bivio reale — Weimar era condannata?", "fasc": "Il fascismo italiano prende il potere combinando pressione violenta e legittimità formale. La sequenza Matteotti–Aventino–3 gennaio 1925 è il momento in cui la dittatura si rivela aperta. Primo regime del Novecento di questo tipo, con una memoria pubblica ancora contesa.", "rep": "La Repubblica nata dalla Resistenza costruisce un sistema politico basato sui partiti di massa che regge per quarant'anni, poi crolla con Tangentopoli nel 1992. L'Uomo qualunque di Giannini (1944) ne anticipa le fragilità: la democrazia vista come ceto politico separato dai cittadini.", "rel": "L'ordine internazionale costruito nel 1945 è sotto pressione: disimpegno americano, sfida cinese, ritorno delle sfere d'influenza. La narrazione pubblica — 'stiamo tornando a un mondo di grandi potenze' — è il punto di partenza per la risalita storica.", "onu": "Nel 1945 gli Stati Uniti costruiscono un ordine internazionale a propria immagine: ONU, FMI, Banca Mondiale, il dollaro come valuta di riserva. Un comando diverso dall'impero ottocentesco — basato su istituzioni e regole — con la questione aperta di chi ne definisce le regole.", "cina": "La rivoluzione maoista del 1949 porta la Cina nel campo socialista, ma la rottura con l'URSS mostra che il bipolarismo non è monolitico. Con Deng l'economia si apre al mercato senza aprire la politica: un modello che sfida l'ordine liberale americano senza combatterlo militarmente.", "m91": "Con la dissoluzione dell'URSS gli USA restano l'unica superpotenza. Fukuyama annuncia la fine della storia: la democrazia liberale ha vinto definitivamente. La parentesi dura un decennio: il 2001 chiude il momento unipolare e apre una fase che non ha ancora trovato un nome.", "s7ott": "L'attacco di Hamas del 7 ottobre 2023 e la risposta militare israeliana a Gaza riaprono la questione palestinese con nuova violenza. In Europa le narrazioni si dividono nettamente: il conflitto divide l'opinione pubblica anche fuori dalla regione, riattivando la domanda sulle radici storiche.", "sion": "Il movimento sionista nasce nell'Europa dell'antisemitismo come risposta nazionale alla persecuzione. La dichiarazione Balfour del 1917 — 67 parole che promettono la stessa terra a due popoli — e i mandati britannici creano le premesse del conflitto. La partizione ONU del 1947 produce due narrazioni incompatibili.", "p47": "La nascita di Israele nel 1948 è la Nakba per i palestinesi: due nomi per lo stesso evento, due esperienze radicalmente diverse. Le guerre successive fissano le frontiere e costruiscono le narrazioni nazionali su entrambi i lati. Il caso di corroborazione più potente del corso.", "oslo": "L'OLP riconosce Israele e Israele riconosce l'OLP: gli accordi di Oslo del 1993 sembrano aprire la strada a due Stati. Il bivio mancato: dopo Oslo c'era ancora una soluzione possibile? La domanda aperta che il 7 ottobre 2023 rende urgente.", "mear": "Il Medio Oriente è il campo dove si scaricano le tensioni globali: petrolio, guerra fredda combattuta per procura, rivoluzione iraniana del 1979, guerre del Golfo. Non solo il conflitto israelo-palestinese: una regione strutturalmente instabile che connette ordine internazionale, mercato e violenza.", "costo": "Il costo della vita cresce, le case non si riescono a comprare, i lavori sono precari. Le disuguaglianze aumentano da quarant'anni in quasi tutti i paesi avanzati. Chi ha deciso che le cose funzionassero così, e quando? La domanda porta direttamente alla svolta degli anni Ottanta.", "p29": "Il crollo di Wall Street nel 1929 dimostra che il mercato non si regola da solo. Roosevelt risponde con il New Deal: lo Stato entra nell'economia come attore diretto — welfare, regolazione, spesa pubblica. È la prima risposta moderna alla crisi del capitalismo, e il modello che durerà fino agli anni Settanta.", "trig": "Tra il 1945 e il 1975 l'Europa occidentale conosce una crescita senza precedenti, accompagnata dalla costruzione del welfare state. Il compromesso tra Stato e mercato funziona: piena occupazione, aumento dei salari reali, riduzione delle disuguaglianze. La crisi petrolifera del 1973 lo mette in discussione.", "pet": "La guerra dello Yom Kippur del 1973 scatena l'embargo petrolifero dell'OPEC. Il prezzo del petrolio quadruplica in pochi mesi e la stagflazione — inflazione più disoccupazione — mette fine ai trenta gloriosi. È la crisi che apre la strada alla svolta neoliberale degli anni Ottanta.", "neo": "Reagan e Thatcher negli anni Ottanta rovesciano il paradigma del dopoguerra: meno Stato, più mercato. Privatizzazioni, deregolamentazione, riduzione delle tasse sui redditi alti, primato della finanza sull'economia reale. Una scelta politica presentata come necessità economica — il bivio da analizzare.", "c08": "Il crollo di Lehman Brothers nel 2008 è la contraddizione interna al neoliberismo: lo Stato salva il mercato che diceva di non aver bisogno dello Stato. Le politiche di austerità che seguono distribuiscono il costo sui ceti più vulnerabili. Connessione diretta con le disuguaglianze contemporanee.", "boom": "L'Italia degli anni Cinquanta-Sessanta cresce rapidamente e si trasforma da paese agricolo a potenza industriale. Il sistema dei partiti gestisce la crescita con spesa pubblica crescente, accumulando debito. L'adesione all'euro nel 1999 è il vincolo esterno che impone la disciplina che la politica interna non riusciva a produrre.", "eleu": "Le elezioni europee del 2024 registrano l'avanzata delle destre sovraniste in quasi tutta Europa. Il dibattito sulla difesa comune, accelerato dal disimpegno americano, riapre la domanda su cosa voglia essere l'Europa. La Brexit ha dimostrato che il processo di integrazione non è irreversibile.", "ceca": "La CECA nel 1951 e i Trattati di Roma nel 1957 nascono dal trauma delle due guerre mondiali. Tre paesi nemici decidono di rendere impossibile una nuova guerra legando le loro economie. Adenauer, De Gasperi, Schuman costruiscono il progetto europeo sui confini che li avevano separati.", "cee": "Il mercato comune si espande, l'allargamento a est segue la fine della guerra fredda, ma l'unione politica non tiene il passo dell'integrazione economica. Maastricht nel 1992 crea l'unione monetaria senza unione fiscale: una costruzione incompiuta che la crisi del 2010 metterà duramente alla prova.", "bx": "La crisi dell'euro tra il 2010 e il 2015 mostra le contraddizioni di un'unione monetaria senza solidarietà fiscale: la Grecia come caso estremo, l'austerità come politica imposta dall'esterno. Nel 2016 la Brexit dimostra che l'integrazione non è irreversibile. Un bivio che l'Europa non ha ancora superato."};
const FN={"pop": "Populismi oggi", "weim": "Germania da Weimar al nazismo", "fasc": "Fascismo italiano", "rep": "Repubblica dei partiti", "rel": "Relazioni internazionali oggi", "onu": "L'ONU e il nuovo ordine mondiale", "cina": "Cina 1949-oggi", "m91": "Mondo 1991-2001", "s7ott": "7 ottobre 2023", "sion": "Dal sionismo alla nascita dello Stato di Israele", "p47": "Guerre arabo-israeliane 1948-67", "oslo": "Questione palestinese 1964-1995", "mear": "Medioriente nel secondo dopoguerra", "costo": "Disuguaglianze delle società contemporanee", "p29": "1929 e il New Deal", "trig": "I trenta gloriosi", "pet": "Shock petrolifero 1973", "neo": "Neoliberismo", "c08": "Crisi 2008", "boom": "L'Italia dal miracolo economico all'euro", "eleu": "Elezioni EU 2024", "ceca": "Le origini del processo di integrazione europeo", "cee": "CEE → Maastricht", "bx": "Crisi euro e Brexit"};
const fa={},aa={};

function toggleFilo(id){
  fa[id]=!fa[id];
  document.getElementById('filo-'+id).style.display=fa[id]?'':'none';
  document.getElementById('fbtn-'+id).classList.toggle('on',!!fa[id]);
  hilite();
}
function toggleAmb(id){
  aa[id]=!aa[id];
  document.getElementById('amb-'+id).style.display=aa[id]?'':'none';
  document.getElementById('abtn-'+id).classList.toggle('on',!!aa[id]);
}
function hilite(){
  const act=Object.keys(fa).filter(k=>fa[k]);
  document.querySelectorAll('.nrect').forEach(r=>{
    const nf=(r.dataset.fili||'').split(',');
    const hit=act.filter(f=>nf.includes(f));
    if(!act.length){r.style.opacity='1';r.setAttribute('stroke',r.dataset.bs);r.setAttribute('stroke-width', r.getAttribute('stroke-width')<1.5?'1':r.getAttribute('stroke-width'));}
    else if(hit.length){r.style.opacity='1';r.setAttribute('stroke',FL[hit[0]].col);r.setAttribute('stroke-width','2.5');}
    else{r.style.opacity='0.25';r.setAttribute('stroke',r.dataset.bs);}
  });
  document.querySelectorAll('.ntxt').forEach(t=>{
    const nf=(t.dataset.fili||'').split(',');
    t.style.opacity=(!act.length||act.filter(f=>nf.includes(f)).length)?'1':'0.15';
  });
}
function showInfo(id){
  document.getElementById('ipn').textContent=FN[id]||id;
  document.getElementById('ipd').textContent=DS[id]||'';
  document.getElementById('ip').style.display='block';
}
function closeI(){document.getElementById('ip').style.display='none';}
</script>
