<script>
var nodes={
  centro:{title:"Riforma, impero e Controriforma",color:"#8B7355",text:"Il capitolo ricostruisce le condizioni che resero possibile la Riforma protestante — la crisi della Chiesa, la struttura dell'Impero, il quadro geopolitico — e ne segue gli sviluppi fino alla risposta cattolica di Trento. La domanda di fondo non è perché la Riforma nacque, ma perché stavolta non fu possibile soffocarla."},
  prereq:{title:"Prerequisiti",color:"#a09070",text:"Prima di affrontare il capitolo è necessario richiamare: la crisi della Chiesa medievale e i movimenti pre-riformatori (Wycliffe, Hus); l'Umanesimo e il nuovo approccio filologico ai testi sacri (Valla, Erasmo); la struttura politica del Sacro Romano Impero; il quadro delle monarchie europee a inizio Cinquecento."},
  crisi:{title:"La crisi della Chiesa di Roma",color:"#993c1d",text:"La Chiesa che Lutero conobbe non era in declino improvviso: era il risultato di una trasformazione secolare. I papi del tardo Quattrocento governavano come principi, praticavano il nepotismo, finanziavano guerre attraverso la vendita delle indulgenze. Le critiche non nascevano con Lutero — Wycliffe e Hus le avevano formulate un secolo prima."},
  lutero:{title:"Lutero e la rottura",color:"#ba7517",text:"Il 31 ottobre 1517 Lutero affisse le 95 Tesi: non un manifesto rivoluzionario, ma domande sul fondamento dottrinale delle indulgenze. Quello che seguì — la scomunica, la Dieta di Worms, l'Editto che lo dichiarò fuorilegge — trasformò una disputa accademica in uno scisma."},
  moltiplica:{title:"La Riforma si moltiplica",color:"#185fa5",text:"Quello che Lutero aveva innescato non era un movimento unitario: era un campo in espansione. Zwingli a Zurigo, Calvino a Ginevra, gli anabattisti in Germania, Enrico VIII in Inghilterra — ciascuno a partire dalle stesse premesse, verso conclusioni radicalmente diverse. La Guerra dei contadini (1524-25) tracciò la linea di frattura tra riforma religiosa e rivoluzione sociale."},
  carlov:{title:"Carlo V e l'impero impossibile",color:"#3b6d11",text:"Carlo V ereditò per accumulazione dinastica il dominio più vasto che l'Europa avesse mai visto. Il sogno della monarchia universale cristiana si scontrò con quattro fronti simultanei: Francia, principi protestanti, Ottomani, papato. La Pace di Augusta (1555) fu la resa formale del progetto imperiale unitario."},
  risposta:{title:"La risposta cattolica",color:"#0f6e56",text:"La risposta della Chiesa fu tutt'altro che unitaria: convissero un impulso al rinnovamento spirituale interno e una reazione istituzionale che puntava alla chiusura dottrinale. Il Concilio di Trento (1545-1563) fu il luogo in cui si misurarono queste spinte. Accanto ad esso: l'Inquisizione romana, l'Indice dei libri proibiti, la Compagnia di Gesù."},
  'q-calvino':{title:"Questione controversa — Calvinismo e capitalismo",color:"#a09070",text:"Max Weber (1905): il calvinismo produsse un'etica dell'ascesi intramondana — il lavoro come vocazione, il profitto come gloria di Dio — che fu la matrice culturale del capitalismo moderno. Tawney e Braudel contestarono la direzione causale. Il dibattito ha chiarito che la Riforma produsse effetti culturali di lungo periodo che non si riducono alla sola sfera religiosa."},
  'q-controriforma':{title:"Questione controversa — Controriforma o Riforma cattolica?",color:"#a09070",text:"Hubert Jedin (1949-75) distinse tra Gegenreformation — reazione anti-protestante — e Katholische Reform, riforma con radici proprie nel tardo Quattrocento. Paolo Prodi e John O'Malley hanno sottolineato come le due componenti fossero storicamente inestricabili. La scelta del termine riflette una valutazione del rapporto tra la Chiesa e la modernità."},
  'f-indulgenze':{title:"Focus — L'affare delle indulgenze",color:"#d4906a",text:"Per finanziare la ricostruzione di San Pietro, Leone X indisse nel 1514 un'indulgenza plenaria. In Germania la gestione fu affidata ad Alberto di Hohenzollern, che si servì del predicatore Johann Tetzel. Il suo slogan — 'non appena la moneta cade nella cassetta, l'anima vola in Paradiso' — fu la scintilla diretta delle 95 Tesi."},
  'f-teologia':{title:"Focus — La teologia di Lutero",color:"#d4a060",text:"Al centro della rottura: la giustificazione per sola fede, la sola Scriptura come unica autorità, il sacerdozio universale dei credenti. Tre principi che scardinano il sistema sacramentale e penitenziale su cui la Chiesa fondava la propria mediazione tra Dio e i fedeli."},
  'f-stampa':{title:"Focus — La stampa e la Riforma",color:"#d4a060",text:"Tra il 1517 e il 1520 furono pubblicate circa trecentomila copie degli scritti di Lutero. La stampa trasformò una disputa teologica in un dibattito pubblico di massa, grazie a opuscoli in volgare accessibili anche agli analfabeti. Nessun riformatore precedente aveva avuto questo strumento."},
  'f-calvino':{title:"Calvino e Ginevra",color:"#5090cc",text:"L'Institutio Christianae Religionis (1536) fu la sistemazione teologica più organica della Riforma. Ginevra sotto Calvino divenne uno Stato modello retto dal Concistoro. Il calvinismo si diffuse come 'religione della resistenza' nelle Province Unite, in Scozia, tra gli ugonotti francesi."},
  'f-anglicano':{title:"Lo scisma anglicano",color:"#5090cc",text:"Lo scisma inglese non fu una riforma teologica ma un conflitto dinastico: Enrico VIII aveva bisogno di un erede maschio. L'Atto di Supremazia del 1534 dichiarò il re capo della Chiesa d'Inghilterra. La dottrina protestante arrivò con Edoardo VI e si consolidò con Elisabetta I."},
  'f-guerre':{title:"Le guerre e l'abdicazione",color:"#70a060",text:"Il Sacco di Roma (1527), la vittoria di Mühlberg (1547), la sconfitta politica ad Augusta (1555): trent'anni di guerre quasi ininterrotte si conclusero con l'abdicazione nel castello di Bruxelles. Carlo divise i domini tra il figlio Filippo II e il fratello Ferdinando I."},
  'f-trento':{title:"Focus — Il Concilio di Trento",color:"#50a882",text:"Quasi vent'anni di lavori (1545-1563). Sul piano dottrinale: condanna della sola fides, conferma dei sette sacramenti, dogma della transustanziazione. Sul piano disciplinare: obbligo di residenza per vescovi e parroci, istituzione dei seminari, divieto del cumulo dei benefici."},
  'f-gesuiti':{title:"Focus — La Compagnia di Gesù",color:"#50a882",text:"Fondata da Ignazio di Loyola e approvata nel 1540. Disciplina quasi militare, quarto voto di obbedienza al papa (perinde ac cadaver). Monopolizzarono l'educazione delle élite europee e si lanciarono in missioni nelle Americhe, in Giappone, in Cina."},
  'f-inquisizione':{title:"Focus — L'Inquisizione romana",color:"#50a882",text:"Istituita da Paolo III nel 1542. Coordina una rete di tribunali locali per la repressione delle eresie. Colpì protestanti, intellettuali anticonformisti, minoranze religiose. La storiografia più recente (Kamen, Prosperi) ha mostrato che il sistema di controllo sulle coscienze fu capillare ben oltre il numero dei roghi."}
};

function openNode(id){
  var n=nodes[id];
  if(!n) return;
  document.getElementById('dp-dot').style.background=n.color;
  document.getElementById('dp-title').textContent=n.title;
  document.getElementById('dp-text').textContent=n.text;
  document.getElementById('detail-panel').classList.add('open');
  document.getElementById('detail-panel').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function closePanel(){
  document.getElementById('detail-panel').classList.remove('open');
}
</script>
</body>
