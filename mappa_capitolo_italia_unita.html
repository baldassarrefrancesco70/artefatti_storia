<script>
const PERIODS = {
  destra:   { label: 'Destra storica · 1861–1876', color: '#4A6741' },
  sinistra: { label: 'Sinistra storica · 1876–1887', color: '#5B7FA6' },
  crispi:   { label: 'Età crispina · 1887–1896', color: '#8B5E3C' },
  crisi:    { label: 'Crisi di fine secolo · 1896–1900', color: '#7A2E1A' }
};

const INFO = {
  destra: [
    {
      theme: 'L\'organizzazione dello Stato unitario',
      text: 'Come governare un territorio diviso fino a ieri in sette entità politiche diverse? La Destra scelse il centralismo sul modello francese: estese gli ordinamenti piemontesi all\'intera penisola per decreto, affidò le province a prefetti di nomina governativa, unificò codici, moneta e legge elettorale. Fu la "piemontesizzazione" — una scelta rapida ed efficace, ma non priva di costi per le autonomie locali e le tradizioni giuridiche preesistenti.'
    },
    {
      theme: 'Le scelte economiche',
      text: 'Il liberismo della Destra non era solo un\'ideologia: era anche una risposta all\'emergenza. Il nuovo Stato aveva ereditato un debito enorme e non disponeva di capitali adeguati. La strada scelta fu il rigore: mercato nazionale unificato, investimenti nelle ferrovie, tassazione pesante sulle imposte indirette. Il provvedimento più impopolare fu la tassa sul macinato (1868). Nel 1875 il pareggio di bilancio fu raggiunto — ma il paese che lo aveva finanziato era più povero e più diseguale.'
    },
    {
      theme: 'La questione meridionale e il brigantaggio',
      text: 'Il brigantaggio che esplose nel Mezzogiorno tra il 1861 e il 1865 non fu semplice criminalità: fu una guerra civile e sociale alimentata dalla delusione delle aspettative contadine, dall\'imposizione di tasse e leva militare, dal sostegno borbonico e pontificio alle bande. Lo Stato rispose con fino a 120.000 soldati e la legge Pica (1863), che sospese le garanzie costituzionali nelle province colpite. La vittoria militare non toccò nulla di ciò che aveva prodotto il fenomeno.'
    },

      theme: 'La questione romana',

const openPeriods = {};
let currentKey = null;

function togglePeriod(p) {
  const wasOpen = openPeriods[p];
  openPeriods[p] = !wasOpen;

  const cls = 'l2-' + p;
  document.querySelectorAll('.' + cls).forEach(el => {
    el.style.display = openPeriods[p] ? '' : 'none';
  });

  const rect = document.getElementById('rect-' + p);
  if (rect) rect.style.opacity = openPeriods[p] ? '0.75' : '1';

  if (!openPeriods[p]) closeInfo();
}

function showInfo(period, idx) {
  const d = INFO[period][idx];
  const per = PERIODS[period];
  const panel = document.getElementById('infoPanel');

  const periodEl = document.getElementById('infoPeriod');
  periodEl.textContent = per.label;
  periodEl.style.color = per.color;

  document.getElementById('infoTheme').textContent = d.theme;
  document.getElementById('infoTheme').style.color = per.color;

  const border = {
    destra: '4px solid #4A6741',
    sinistra: '4px solid #5B7FA6',
    crispi: '4px solid #8B5E3C',
    crisi: '4px solid #7A2E1A'
  };
  panel.style.borderLeft = border[period];

  document.getElementById('infoText').textContent = d.text;
  panel.classList.add('show');
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  currentKey = period + '-' + idx;
}

function closeInfo() {
  document.getElementById('infoPanel').classList.remove('show');
  currentKey = null;
}
</script>
